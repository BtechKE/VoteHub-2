<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A1A19">
  <title>Live Results — TallyHub</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================================
       YOUR EXACT CSS (Auroras, Glass Cards, Mobile Responsive)
    ============================================================ */
    :root {
      --blue: #1591DC; --blue-soft: rgba(21, 145, 220, 0.12); --blue-glow: rgba(21, 145, 220, 0.35);
      --green: #A5CF83; --green-soft: rgba(165, 207, 131, 0.15); --green-dark: #7EAE5C;
      --slate: #435663; --slate-soft: rgba(67, 86, 99, 0.10);
      --ink: #1A1A19; --ink-2: #2A2A28; --canvas: #F0F0F0; --surface: #FFFFFF;
      --danger: #C4453A; --danger-soft:rgba(196, 69, 58, 0.10);
      --border: rgba(26, 26, 25, 0.08); --border-2: rgba(26, 26, 25, 0.14);
      --radius: 16px; --radius-lg: 22px; --topbar-h: 60px; --tabs-h: 56px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior-y: contain; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--canvas); color: var(--ink); min-height: 100dvh; -webkit-font-smoothing: antialiased; font-size: 15px; }

    /* TOPBAR */
    .topbar { position: sticky; top: 0; z-index: 100; background: var(--ink); color: #F0F0F0; padding: 10px 16px; min-height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .topbar-left { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex-shrink: 0; position: relative; }
    .pulse::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: var(--green); opacity: 0.4; animation: pulse 2s ease-out infinite; }
    .pulse.stale { background: var(--slate); } .pulse.stale::after { background: var(--slate); animation: none; opacity: 0.2; }
    .pulse.loading { background: var(--blue); } .pulse.loading::after { background: var(--blue); animation: pulse 0.9s linear infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(2.4); opacity: 0; } }
    .topbar-info { min-width: 0; flex: 1; }
    .topbar-name { font-size: 14.5px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-meta { font-size: 11.5px; color: rgba(240, 240, 240, 0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .topbar-refresh { background: rgba(240, 240, 240, 0.10); border: none; width: 38px; height: 38px; border-radius: 11px; color: #F0F0F0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background-color 0.15s; }
    .topbar-refresh:hover { background: rgba(240, 240, 240, 0.18); } .topbar-refresh:active { transform: scale(0.94); }
    .topbar-refresh .spin { animation: spin 0.9s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .topbar-logout { background: transparent; border: 1px solid rgba(240, 240, 240, 0.2); color: #F0F0F0; padding: 8px 12px; border-radius: 11px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .topbar-logout:hover { background: var(--danger-soft); border-color: var(--danger); color: #FF9B8F; }
    .topbar-logout span { display: none; } @media (min-width: 480px) { .topbar-logout span { display: inline; } }

    /* TABS */
    .postabs { position: sticky; top: var(--topbar-h); z-index: 90; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px; min-height: var(--tabs-h); display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .postabs::-webkit-scrollbar { display: none; }
    .postab { padding: 8px 14px; border-radius: 20px; background: var(--canvas); border: 1px solid transparent; color: var(--slate); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; transition: background-color 0.15s, color 0.15s, border-color 0.15s; flex-shrink: 0; }
    .postab:hover { background: var(--blue-soft); color: var(--ink); }
    .postab.active { background: var(--ink); color: #F0F0F0; border-color: var(--ink); }
    .postab.mine::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
    .postab.mine.active::before { background: var(--green); }
    .postab .pill { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 20px; background: rgba(67, 86, 99, 0.12); color: var(--slate); }
    .postab.active .pill { background: rgba(240, 240, 240, 0.18); color: #F0F0F0; }

    /* PAGE */
    .page { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; }

    /* HERO */
    .hero { background: var(--ink); color: #F0F0F0; border-radius: var(--radius-lg); padding: 22px; margin-bottom: 16px; position: relative; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(26, 26, 25, 0.4); }
    .hero::before { content: ''; position: absolute; top: -120px; right: -120px; width: 340px; height: 340px; background: radial-gradient(circle, var(--blue-glow) 0%, transparent 65%); opacity: 0.55; pointer-events: none; }
    .hero::after { content: ''; position: absolute; bottom: -140px; left: -100px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(165, 207, 131, 0.22) 0%, transparent 70%); pointer-events: none; }
    .hero.other { background: var(--surface); color: var(--ink); box-shadow: 0 4px 20px rgba(26, 26, 25, 0.06); border: 1px solid var(--border); }
    .hero.other::before { background: radial-gradient(circle, rgba(21, 145, 220, 0.10) 0%, transparent 65%); }
    .hero.other::after { display: none; }
    .hero.other .hero-eyebrow { color: var(--slate); } .hero.other .hero-name { color: var(--ink); } .hero.other .hero-meta { color: var(--slate); }
    .hero.other .hero-stat-num { color: var(--ink); } .hero.other .hero-stat-lbl { color: var(--slate); } .hero.other .hero-rank { color: var(--slate); }
    .hero.other .hero-share-bar { background: rgba(67, 86, 99, 0.14); } .hero.other .hero-live { color: var(--slate); }
    .hero-inner { position: relative; z-index: 1; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .hero-live { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: rgba(240, 240, 240, 0.7); letter-spacing: 0.2px; }
    .hero-live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 var(--green); animation: pulse-dot 2s ease-out infinite; }
    .hero-live.stale .dot { background: var(--slate); animation: none; }
    @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(165, 207, 131, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(165, 207, 131, 0); } 100% { box-shadow: 0 0 0 0 rgba(165, 207, 131, 0); } }
    .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
    .badge-status.leading { background: var(--green); color: var(--ink); }
    .badge-status.trailing { background: rgba(240, 240, 240, 0.12); color: rgba(240, 240, 240, 0.8); }
    .badge-status.neutral { background: var(--slate); color: #F0F0F0; }
    .hero.other .badge-status.trailing { background: var(--slate-soft); color: var(--slate); }
    .hero.other .badge-status.neutral { background: var(--blue); color: #fff; }
    .hero-rank { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; color: rgba(240, 240, 240, 0.55); letter-spacing: 0.4px; }
    .hero-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(240, 240, 240, 0.5); margin-bottom: 4px; }
    .hero-name { font-size: clamp(22px, 3.4vw, 30px); font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; color: #F0F0F0; margin-bottom: 4px; }
    .hero-meta { font-size: 13px; color: rgba(240, 240, 240, 0.6); font-weight: 500; }
    .hero-stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; margin: 22px 0 18px; padding: 18px 0; border-top: 1px solid rgba(240, 240, 240, 0.08); border-bottom: 1px solid rgba(240, 240, 240, 0.08); }
    .hero.other .hero-stats { border-color: var(--border); }
    .hero-stat-num { font-size: clamp(26px, 4.5vw, 40px); font-weight: 800; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; color: #F0F0F0; }
    .hero-stat-lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: rgba(240, 240, 240, 0.5); margin-top: 6px; }
    .hero-stat-num.green { color: var(--green); } .hero-stat-num.blue { color: var(--blue); }
    .hero-share { margin-top: 4px; }
    .hero-share-track { height: 8px; background: rgba(240, 240, 240, 0.10); border-radius: 20px; overflow: hidden; }
    .hero-share-bar { height: 100%; background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%); border-radius: 20px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .hero-share-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: rgba(240, 240, 240, 0.5); margin-top: 8px; font-weight: 500; }
    .hero.other .hero-share-legend { color: var(--slate); }

    /* SECTION HEADERS */
    .section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 26px 2px 12px; flex-wrap: wrap; }
    .section-title { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .section-title i { color: var(--blue); font-size: 14px; }
    .section-sub { font-size: 12.5px; color: var(--slate); font-weight: 500; margin-top: 3px; }
    .section-count { font-size: 12px; color: var(--slate); font-weight: 600; }

    /* BREADCRUMB */
    .breadcrumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12.5px; font-weight: 600; }
    .bc-seg { padding: 5px 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; color: var(--slate); cursor: pointer; font-family: inherit; transition: background-color 0.15s, color 0.15s, border-color 0.15s; display: inline-flex; align-items: center; gap: 6px; }
    .bc-seg:hover { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
    .bc-seg.current { background: var(--ink); border-color: var(--ink); color: #F0F0F0; cursor: default; }
    .bc-seg.current:hover { background: var(--ink); border-color: var(--ink); color: #F0F0F0; }
    .bc-sep { color: var(--slate); font-size: 11px; }

    /* DRILL GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; position: relative; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; gap: 12px; }
    .card:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 12px 32px -12px var(--blue-glow); }
    .card:active { transform: scale(0.985); }
    .card.leading { border-left: 3px solid var(--green); } .card.trailing { border-left: 3px solid var(--slate); } .card.empty { border-left: 3px solid var(--border-2); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-name { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.25; letter-spacing: -0.2px; }
    .card-sub { font-size: 11.5px; color: var(--slate); margin-top: 2px; font-weight: 500; }
    .card-status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; flex-shrink: 0; }
    .card-status.done { background: var(--green-soft); color: var(--green-dark); } .card-status.partial { background: var(--blue-soft); color: var(--blue); } .card-status.pending { background: var(--slate-soft); color: var(--slate); }
    .card-leader { display: flex; align-items: center; gap: 10px; }
    .card-leader-crown { width: 30px; height: 30px; border-radius: 8px; background: var(--green-soft); color: var(--green-dark); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .card.leading .card-leader-crown { background: var(--green); color: var(--ink); } .card-trailing .card-leader-crown { background: var(--slate-soft); color: var(--slate); }
    .card-leader-info { min-width: 0; flex: 1; }
    .card-leader-name { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-leader-party { font-size: 11.5px; color: var(--slate); margin-top: 1px; }
    .card-numbers { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-votes { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px; font-variant-numeric: tabular-nums; line-height: 1; }
    .card-pct { font-size: 13px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; }
    .card-votes-lbl { font-size: 10.5px; color: var(--slate); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; margin-top: 4px; }
    .card-bar { height: 5px; background: var(--canvas); border-radius: 20px; overflow: hidden; }
    .card-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%); border-radius: 20px; transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
    .card.trailing .card-bar-fill { background: linear-gradient(90deg, var(--slate) 0%, #2f3b46 100%); }
    .card-empty-body { text-align: center; padding: 14px 0; color: var(--slate); font-size: 12.5px; }
    .card-empty-body i { font-size: 20px; color: var(--border-2); display: block; margin-bottom: 6px; }

    /* LEADERBOARD */
    .board { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .board-row { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background-color 0.15s; cursor: pointer; }
    .board-row:last-child { border-bottom: none; } .board-row:hover { background: var(--canvas); }
    .board-row.you { background: linear-gradient(to right, var(--blue-soft) 0%, transparent 60%); border-left: 3px solid var(--blue); }
    .board-row.leader .board-rank { background: var(--green); color: var(--ink); border-color: var(--green-dark); }
    .board-row.rank-2 .board-rank { background: var(--slate); color: #F0F0F0; border-color: var(--slate); }
    .board-row.rank-3 .board-rank { background: var(--slate-soft); color: var(--slate); }
    .board-rank { width: 30px; height: 30px; border-radius: 50%; background: var(--canvas); border: 1.5px solid var(--border-2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--slate); font-variant-numeric: tabular-nums; }
    .board-info { min-width: 0; }
    .board-name { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .board-party { font-size: 11.5px; color: var(--slate); margin-top: 2px; font-weight: 500; }
    .board-you-pill { display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; padding: 1px 7px; border-radius: 20px; background: var(--blue); color: #fff; margin-left: 6px; vertical-align: middle; text-transform: uppercase; }
    .board-votes { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; letter-spacing: -0.3px; line-height: 1.1; }
    .board-pct { font-size: 11.5px; color: var(--slate); text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .board-delta { font-size: 11px; font-weight: 700; margin-top: 2px; color: var(--green-dark); }
    .board-delta.up::before { content: '▲ '; } .board-delta.down { color: var(--danger); } .board-delta.down::before { content: '▼ '; }
    .board-delta.same { color: var(--slate); } .board-delta.same::before { content: '· '; }
    .board-share { width: 70px; height: 4px; background: var(--canvas); border-radius: 20px; overflow: hidden; margin-top: 6px; margin-left: auto; }
    .board-share-fill { height: 100%; background: var(--green); border-radius: 20px; transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
    .board-row.you .board-share-fill { background: var(--blue); }
    .board-row:not(.leader):not(.you) .board-share-fill { background: var(--slate); opacity: 0.55; }

    /* FOOTER */
    .foot { margin-top: 32px; padding: 20px 16px; text-align: center; font-size: 11.5px; color: var(--slate); line-height: 1.6; }
    .foot i { color: var(--blue); margin-right: 4px; } .foot-tiny { opacity: 0.7; margin-top: 6px; }

    /* COMPARISON SHEET */
    .sheet-bg { position: fixed; inset: 0; background: rgba(26, 26, 25, 0.55); display: none; z-index: 9000; opacity: 0; transition: opacity 0.22s ease; padding: 16px; }
    .sheet-bg.active { display: flex; opacity: 1; align-items: center; justify-content: center; }
    .sheet { background: var(--surface); border-radius: 22px; width: 100%; max-width: 520px; max-height: 85dvh; overflow-y: auto; padding: 20px 22px 24px; transform: scale(0.94) translateY(12px); transition: transform 0.28s cubic-bezier(0.34, 1.35, 0.64, 1); position: relative; box-shadow: 0 24px 64px rgba(26, 26, 25, 0.35); }
    .sheet-bg.active .sheet { transform: scale(1) translateY(0); }
    .sheet-grabber { width: 40px; height: 4px; background: var(--border-2); border-radius: 20px; margin: 6px auto 14px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .sheet-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
    .sheet-sub { font-size: 12.5px; color: var(--slate); margin-top: 3px; font-weight: 500; }
    .sheet-close { width: 34px; height: 34px; border-radius: 10px; border: none; background: var(--canvas); color: var(--slate); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: background-color 0.15s, color 0.15s; }
    .sheet-close:hover { background: var(--danger-soft); color: var(--danger); }
    .cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .cmp-card { padding: 16px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--canvas); }
    .cmp-card.winner { border-color: var(--green); background: linear-gradient(135deg, var(--green-soft) 0%, transparent 70%); }
    .cmp-card .who { font-size: 10.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--slate); margin-bottom: 8px; }
    .cmp-card.winner .who { color: var(--green-dark); }
    .cmp-name { font-size: 15px; font-weight: 800; line-height: 1.2; letter-spacing: -0.3px; margin-bottom: 3px; }
    .cmp-party { font-size: 11.5px; color: var(--slate); margin-bottom: 10px; }
    .cmp-votes { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1; font-variant-numeric: tabular-nums; }
    .cmp-pct { font-size: 12.5px; color: var(--slate); font-weight: 600; margin-top: 4px; }

    /* UI KIT */
    .th-modal-bg { position: fixed; inset: 0; background: rgba(26, 26, 25, 0.5); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; opacity: 0; transition: opacity 0.18s ease; }
    .th-modal-bg.active { display: flex; opacity: 1; }
    .th-modal { background: var(--surface); border-radius: 20px; padding: 26px 24px 22px; width: 100%; max-width: 380px; box-shadow: 0 24px 72px rgba(26, 26, 25, 0.3); transform: scale(0.94) translateY(8px); transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1); }
    .th-modal-bg.active .th-modal { transform: scale(1) translateY(0); }
    .th-modal-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 16px; }
    .th-modal-icon.warn { background: rgba(184, 134, 11, 0.12); color: #b8860b; } .th-modal-icon.danger { background: var(--danger-soft); color: var(--danger); } .th-modal-icon.info { background: var(--blue-soft); color: var(--blue); }
    .th-modal-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 6px; letter-spacing: -0.2px; }
    .th-modal-msg { font-size: 13.5px; color: var(--slate); text-align: center; line-height: 1.55; }
    .th-modal-msg strong { color: var(--ink); font-weight: 600; }
    .th-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .th-modal-actions.single { grid-template-columns: 1fr; }
    .th-btn { padding: 12px 16px; border: none; border-radius: 11px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background-color 0.15s, color 0.15s, transform 0.1s; }
    .th-btn:active { transform: scale(0.98); }

<script>
// ================================================================
//  SUPABASE INITIALIZATION
// ================================================================
const supabaseUrl = 'https://qkkhtglsstinsvbdmclt.supabase.co';
const supabaseKey = 'sb_publishable_AEFOxR5dWWyQu9ZIaYMwLQ_4dPU-RM0';
const db = window.supabase.createClient(supabaseUrl, supabaseKey);
// Helper to get/generate a unique device ID
function getDeviceId() {
  let devId = localStorage.getItem('tallyhub_device_id');
  if (!devId) {
    devId = 'DEV-' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
    localStorage.setItem('tallyhub_device_id', devId);
  }
  return devId;
}

// ================================================================
//  CONSTANTS & STATE
// ================================================================
var USER = null; 
var TOKEN = "supabase"; 
var OVERVIEW = null; 
var VIEW_POS = 'President';

var CURRENT_VIEW = 'results'; 
var SCOPE_MODE = 'national'; // 'national', 'county', 'constituency', or 'ward'
var CURRENT_COUNTY = ''; 

// --- DRILL DOWN STATE ---
var DRILL_LEVEL = ''; // 'constituency', 'ward', or 'centre'
var DRILL_COUNTY_ID = ''; 
var DRILL_COUNTY_NAME = '';
var DRILL_CONST_ID = ''; 
var DRILL_CONST_NAME = '';
var DRILL_WARD = ''; 
var DRILL_WARD_NAME = '';
var DRILL_CENTRE = ''; 
var DRILL_CENTRE_NAME = ''; 
var DRILL_DATA = null;
// --- TRACKER STATE ---
var TRACKER_FORMS = {}; // Tracks which stream/position combos have photos
var TRACKER_DATA = null; 
var TRACKER_LEVEL = ''; // 'constituency', 'ward', 'centre', 'stream'
var TRACKER_CONST_ID = ''; 
var TRACKER_CONST_NAME = '';
var TRACKER_WARD = ''; 
var TRACKER_WARD_NAME = '';
var TRACKER_CENTRE = ''; 
var TRACKER_CENTRE_NAME = '';

// --- TIMERS ---
var refreshTimer = null; 
var trackerRefreshAt = null; 
var lastRefreshAt = null;

const POSITIONS = ['President', 'Governor', 'Senator', 'MP', 'Women Rep', 'MCA'];
var POSITION_SHORT = { 'President': 'P', 'Governor': 'G', 'Senator': 'S', 'MP': 'M', 'Women Rep': 'W', 'MCA': 'C' };

// ================================================================
//  INIT & AUTO REFRESH
// ================================================================
async function init() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) { window.location.href = 'index.html'; return; }

  // --- DEVICE LOCK CHECK ---
  const devId = getDeviceId();
  const { data: deviceCheck, error: devErr } = await db.rpc('verify_and_register_device', {
    p_auth_id: user.id,
    p_device_id: devId,
    p_role: 'aspirant'
  });
  
  if (devErr || !deviceCheck.success) {
    db.auth.signOut();
    alert(deviceCheck?.message || 'Device limit reached. Contact Admin.');
    window.location.href = 'index.html';
    return;
  }
  // --------------------------

  const { data: profile } = await db.from('aspirants').select('*').eq('auth_user_id', user.id).single();
  if (!profile) { alert("Profile not found"); doLogout(); return; }
  
  USER = {
    name: profile.name, position: profile.position, 
    ward: profile.ward_id, constituency: profile.constituency_id, 
    county: profile.county_id, loginCode: profile.login_code, isSpectator: profile.is_spectator
  };

  document.getElementById('topName').textContent = USER.name || 'Viewer';
  if (!USER.isSpectator && USER.position && POSITIONS.indexOf(USER.position) !== -1) { VIEW_POS = USER.position; }

  // --- PREMIUM SCOPE BADGE & DRILL LEVEL ---
    if (USER.isSpectator || USER.position === 'President') {
    SCOPE_MODE = 'national';
    DRILL_LEVEL = 'county';      // <--- MUST BE 'county'
    TRACKER_LEVEL = 'county';    // <--- MUST BE 'county'
    document.getElementById('nationalScopeWrap').style.display = 'flex';
    // ...
    
    const { data: counties } = await db.from('counties').select('id, name').order('name');
    if (counties && counties.length > 0) {
      CURRENT_COUNTY = counties[0].id;
      document.getElementById('aspCountySelector').innerHTML = counties.map(c => `<option value="${c.id}">${esc(c.name)} County</option>`).join('');
      document.getElementById('aspCountySelector').value = CURRENT_COUNTY;
    }
  } else {
    let scopeName = 'Scope';
    if (USER.position === 'MCA') {
      SCOPE_MODE = 'ward'; 
      DRILL_LEVEL = 'centre';
      TRACKER_LEVEL = 'centre';
      const { data: w } = await db.from('wards').select('name').eq('id', USER.ward).single();
      scopeName = w ? w.name + ' Ward' : 'Ward';
    } else if (USER.position === 'MP') {
      SCOPE_MODE = 'constituency'; 
      DRILL_LEVEL = 'ward';
      TRACKER_LEVEL = 'ward';
      const { data: c } = await db.from('constituencies').select('name').eq('id', USER.constituency).single();
      scopeName = c ? c.name + ' Constituency' : 'Constituency';
    } else {
      SCOPE_MODE = 'county'; 
      DRILL_LEVEL = 'constituency';
      TRACKER_LEVEL = 'constituency';
      const { data: c } = await db.from('counties').select('name').eq('id', USER.county).single();
      scopeName = c ? c.name + ' County' : 'County';
    }
    
    document.getElementById('lockedScopeName').textContent = scopeName;
    document.getElementById('lockedScopeWrap').style.display = 'flex';
  }

  updateTopMeta();
  loadOverview();
  startAutoRefresh();
}
  function switchAspCounty(countyId) {
  CURRENT_COUNTY = countyId;
  // Reset to top level
  DRILL_LEVEL = 'county';
  DRILL_COUNTY_ID = ''; DRILL_COUNTY_NAME = '';
  DRILL_CONST_ID = ''; DRILL_CONST_NAME = '';
  DRILL_WARD = ''; DRILL_WARD_NAME = '';
  DRILL_CENTRE = ''; DRILL_CENTRE_NAME = '';
  loadOverview();
}
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(function () {
    if (document.hidden) return;
    if (CURRENT_VIEW === 'results') {
      if (DRILL_WARD || DRILL_CENTRE) return;
      if (lastRefreshAt && Date.now() - lastRefreshAt < 4.5 * 60 * 1000) return;
      silentRefresh();
    } else if (CURRENT_VIEW === 'tracker') {
      if (trackerRefreshAt && Date.now() - trackerRefreshAt < 80 * 1000) return;
      loadTracker(true);
    }
  }, 30000);
}

function silentRefresh() { setPulse('loading'); loadOverview(true); }

function manualRefresh() {
  var icon = document.getElementById('topRefreshIcon');
  if (icon) icon.classList.add('spin');
  setPulse('loading');
  if (CURRENT_VIEW === 'tracker') { loadTracker(true); }
  else if (DRILL_WARD || DRILL_CENTRE) { loadDrill(true); }
  else { loadOverview(true); }
  if (icon) setTimeout(function () { icon.classList.remove('spin'); }, 900);
}

// ================================================================
//  DATA LOADING (Supabase)
// ================================================================
async function loadOverview(silent) {
  if (!silent) setPulse('loading');
  try {
    // 1. Fetch Geography (Optimized for National Scope)
    let constQuery = db.from('constituencies').select('*');
    if (SCOPE_MODE === 'constituency') constQuery = constQuery.eq('id', USER.constituency);
    else if (SCOPE_MODE === 'county') constQuery = constQuery.eq('county_id', USER.county);
    const { data: consts } = await constQuery;

    let wardQuery = db.from('wards').select('*');
    if (SCOPE_MODE === 'ward') wardQuery = wardQuery.eq('id', USER.ward);
    else if (SCOPE_MODE === 'constituency') wardQuery = wardQuery.eq('constituency_id', USER.constituency);
    else if (SCOPE_MODE !== 'national') wardQuery = wardQuery.in('constituency_id', (consts||[]).map(c=>c.id));
    const { data: wardsData } = await wardQuery;

    // FIX: If National, don't pass a massive list of IDs. Just fetch all.
    let centreQuery = db.from('centres').select('*');
    if (SCOPE_MODE !== 'national') {
        centreQuery = centreQuery.in('ward_id', (wardsData||[]).map(w=>w.id));
    }
    const { data: centresData } = await centreQuery;

    // FIX: Same here. If National, fetch all streams.
    let streamQuery = db.from('streams').select('*');
    if (SCOPE_MODE !== 'national') {
        streamQuery = streamQuery.in('centre_id', (centresData||[]).map(c=>c.id));
    }
    const { data: streamsData } = await streamQuery;

    // 2. Fetch Candidates
    let candQuery = db.from('candidates').select('*').eq('position', VIEW_POS);
    if (VIEW_POS !== 'President' && SCOPE_MODE !== 'national') {
        candQuery = candQuery.eq('county_id', USER.county);
    }
    const { data: cands } = await candQuery;

    // 3. Fetch Results
    const { data: resultsData } = await db.from('results').select('stream_code, candidate_code, votes').eq('position', VIEW_POS);

    // 4. Build Lookup Maps
    const candMap = {}; (cands || []).forEach(c => { c.photo_url = normalizeImageUrl(c.photo_url); candMap[c.code] = c; });
    const streamMap = {}; (streamsData || []).forEach(s => streamMap[s.code] = s);
    const centreMap = {}; (centresData || []).forEach(c => centreMap[c.id] = c);
    const wardMap = {}; (wardsData || []).forEach(w => wardMap[w.id] = w);
    const constMap = {}; (consts || []).forEach(c => constMap[c.id] = c);

    // Fetch all counties for the national scope (President/Spectator)
    let countiesData = [];
    if (SCOPE_MODE === 'national') {
      const { data: cData } = await db.from('counties').select('*').order('name');
      countiesData = cData || [];
    }
    
    // 5. Aggregate Votes
    const votesByCounty = {};
    const votesByConst = {};
    const votesByWard = {};
    const votesByCentre = {};
    const votesByStream = {}; 
    const totalByCand = {};

    (resultsData || []).forEach(r => {
      const stream = streamMap[r.stream_code];
      if (!stream) return; 
      const centre = centreMap[stream.centre_id];
      if (!centre) return;
      const ward = wardMap[centre.ward_id];
      if (!ward) return;
      const constituency = constMap[ward.constituency_id];
      if (!constituency) return;
      const countyId = constituency.county_id;

      if (!totalByCand[r.candidate_code]) totalByCand[r.candidate_code] = 0;
      totalByCand[r.candidate_code] += r.votes;

      if (!votesByStream[r.stream_code]) votesByStream[r.stream_code] = {};
      votesByStream[r.stream_code][r.candidate_code] = (votesByStream[r.stream_code][r.candidate_code]||0) + r.votes;

      if (!votesByCentre[centre.id]) votesByCentre[centre.id] = {};
      votesByCentre[centre.id][r.candidate_code] = (votesByCentre[centre.id][r.candidate_code]||0) + r.votes;

      if (!votesByWard[ward.id]) votesByWard[ward.id] = {};
      votesByWard[ward.id][r.candidate_code] = (votesByWard[ward.id][r.candidate_code]||0) + r.votes;

      if (!votesByConst[constituency.id]) votesByConst[constituency.id] = {};
      votesByConst[constituency.id][r.candidate_code] = (votesByConst[constituency.id][r.candidate_code]||0) + r.votes;

      if (!votesByCounty[countyId]) votesByCounty[countyId] = {};
      votesByCounty[countyId][r.candidate_code] = (votesByCounty[countyId][r.candidate_code]||0) + r.votes;
    });

    // 6. Format Global Leaderboard
    let leaderboard = (cands || []).map(c => ({
      code: c.code, name: c.name, party: c.party, photo_url: c.photo_url, color: c.color || '#A5CF83', votes: totalByCand[c.code] || 0
    })).sort((a,b) => b.votes - a.votes);
    
    let globalTotal = leaderboard.reduce((s, c) => s + c.votes, 0);
    leaderboard.forEach(c => c.pct = globalTotal > 0 ? ((c.votes/globalTotal)*100).toFixed(1) : '0.0');

    let ownRow = null; let ownRank = null;
    if (!USER.isSpectator && USER.name) {
        const idx = leaderboard.findIndex(c => c.name.trim().toLowerCase() === USER.name.trim().toLowerCase());
        if (idx !== -1) { ownRow = leaderboard[idx]; ownRank = idx + 1; }
    }

    OVERVIEW = {
      viewingPosition: VIEW_POS, leaderboard: leaderboard, globalTotal, ownRow, ownRank,
      leader: leaderboard[0], runner: leaderboard[1], 
      margin: leaderboard[0] && leaderboard[1] ? (leaderboard[0].votes - leaderboard[1].votes) : 0,
      counties: countiesData, consts: consts || [], wards: wardsData || [], centres: centresData || [], streams: streamsData || [],
      votesByCounty, votesByConst, votesByWard, votesByCentre, votesByStream, candMap,
      reported: (resultsData || []).length, totalStreams: (streamsData || []).length
    };

    renderTabs(); renderHero(); renderDrillGrid(); renderBoard();
    setPulse('live');
  } catch (err) {

async function loadDrill(silent) {
  try {
    const [ { data: cands }, { data: streamsData }, { data: centresData }, { data: resultsData } ] = await Promise.all([
        db.from('candidates').select('*'), db.from('streams').select('*'),
        db.from('centres').select('*'), db.from('results').select('*').eq('position', VIEW_POS)
    ]);

    // FIX: Call normalizeImageUrl here too
    const candMap = {}; 
    cands.forEach(c => { 
      c.photo_url = normalizeImageUrl(c.photo_url); 
      candMap[c.code] = c; 
    });
    
    const reportedSet = new Set(resultsData.map(r => r.stream_code));

    if (DRILL_CENTRE) {
        const centreStreams = streamsData.filter(s => s.centre_id === DRILL_CENTRE);
        DRILL_DATA = { level: 'stream', streams: centreStreams.map(s => {
            const sResults = resultsData.filter(r => r.stream_code === s.code);
            const sCandidates = sResults.map(r => {
                const info = candMap[r.candidate_code] || {};
                return { code: r.candidate_code, name: info.name, party: info.party, photo_url: info.photo_url, color: info.color || '#A5CF83', votes: r.votes };
            }).sort((a, b) => b.votes - a.votes);
            const total = sCandidates.reduce((sum, c) => sum + c.votes, 0);
            return { streamCode: s.code, streamLabel: 'STR ' + String(s.stream_number).padStart(2, '0'), centreName: centresData.find(c => c.id === s.centre_id)?.name, candidates: sCandidates, leader: sCandidates[0] || null, totalVotes: total, leaderPct: total > 0 && sCandidates[0] ? ((sCandidates[0].votes / total) * 100).toFixed(1) : '0.0', submitted: reportedSet.has(s.code) };
        }).sort((a, b) => a.streamCode.localeCompare(b.streamCode)) };
    } else if (DRILL_WARD) {
        const wardCentres = centresData.filter(c => c.ward_id === DRILL_WARD);
        DRILL_DATA = { level: 'centre', centres: wardCentres.map(c => {
            const cStreams = streamsData.filter(s => s.centre_id === c.id);
            const cStreamCodes = new Set(cStreams.map(s => s.code));
            const reportedInCentre = new Set(resultsData.filter(r => cStreamCodes.has(r.stream_code)).map(r => r.stream_code)).size;
            const cCandidatesMap = {};
            resultsData.filter(r => cStreamCodes.has(r.stream_code)).forEach(r => {
                if (!cCandidatesMap[r.candidate_code]) cCandidatesMap[r.candidate_code] = { code: r.candidate_code, votes: 0 };
                cCandidatesMap[r.candidate_code].votes += r.votes;
            });
            const cCandidates = Object.values(cCandidatesMap).map(item => {
                const info = candMap[item.code] || {};
                return { ...item, name: info.name, party: info.party, photo_url: info.photo_url, color: info.color || '#A5CF83' };
            }).sort((a, b) => b.votes - a.votes);
            const total = cCandidates.reduce((sum, x) => sum + x.votes, 0);
            return { centreId: c.id, centreName: c.name, candidates: cCandidates, leader: cCandidates[0] || null, totalVotes: total, leaderPct: total > 0 && cCandidates[0] ? ((cCandidates[0].votes / total) * 100).toFixed(1) : '0.0', streamsTotal: cStreams.length, streamsDone: reportedInCentre };
        }) };
    }
    renderDrillGrid(); renderBoard();
  } catch (err) { console.error(err); }
}

async function loadTracker(silent) {
  if (!silent) document.getElementById('trackerGrid').innerHTML = '<div class="load" style="grid-column:1/-1;"><i class="fas fa-spinner"></i>Loading…</div>';
  try {
    var filterWardIds = [];
    var activeCounty = (SCOPE_MODE === 'national') ? CURRENT_COUNTY : USER.county;

    let constQuery = db.from('constituencies').select('*');
    if (SCOPE_MODE === 'constituency') constQuery = constQuery.eq('id', USER.constituency);
    else if (activeCounty) constQuery = constQuery.eq('county_id', activeCounty);
    const { data: constsData } = await constQuery;

    let wardQuery = db.from('wards').select('*');
    if (SCOPE_MODE === 'ward') wardQuery = wardQuery.eq('id', USER.ward);
    else wardQuery = wardQuery.in('constituency_id', (constsData || []).map(c => c.id));
    const { data: wardsData } = await wardQuery;

    filterWardIds = (wardsData || []).map(w => w.id);

    const [ { data: centresData }, { data: streamsData } ] = await Promise.all([
        db.from('centres').select('*').in('ward_id', filterWardIds),
        db.from('streams').select('*').in('ward_id', filterWardIds)
    ]);

    var streamCodes = (streamsData || []).map(s => s.code);
    
    // FETCH RESULTS AND FORMS
    const [ { data: resultsData }, { data: formsData } ] = await Promise.all([
        db.from('results').select('stream_code, position').in('stream_code', streamCodes),
        db.from('form_photos').select('stream_code, position, photo_url').in('stream_code', streamCodes)
    ]);

    // Build the FORMS dictionary
    TRACKER_FORMS = {};
    (formsData || []).forEach(f => {
        TRACKER_FORMS[f.stream_code + '_' + f.position] = f.photo_url;
    });

    const reportedMap = {};
    
    (resultsData || []).forEach(r => {
        if (!reportedMap[r.stream_code]) reportedMap[r.stream_code] = {};
        reportedMap[r.stream_code][r.position] = true;
    });

    let totalCompleteStreams = 0;
    const trackerWards = (wardsData || []).map(w => {
        const wCentres = (centresData || []).filter(c => c.ward_id === w.id);
        let wStreamsTotal = 0, wStreamsComplete = 0, wCellsDone = 0, wCellsTotal = 0;

        const trackerCentres = wCentres.map(c => {
            const cStreams = (streamsData || []).filter(s => s.centre_id === c.id);
            let cStreamsTotal = cStreams.length, cStreamsComplete = 0, cCellsDone = 0, cCellsTotal = cStreamsTotal * POSITIONS.length;

            const trackerStreams = cStreams.map(s => {
                const pips = {}; let done = 0;
                POSITIONS.forEach(p => {
                    if (reportedMap[s.code] && reportedMap[s.code][p]) { pips[p] = { status: 'submitted' }; done++; }
                    else { pips[p] = null; }
                });
                const isComplete = done === POSITIONS.length;
                if (isComplete) cStreamsComplete++;
                cCellsDone += done;
                return { code: s.code, label: 'STR ' + String(s.stream_number).padStart(2, '0'), pips: pips, done: done, total: POSITIONS.length, isComplete: isComplete };
            });

            wStreamsTotal += cStreamsTotal; wStreamsComplete += cStreamsComplete; wCellsDone += cCellsDone; wCellsTotal += cCellsTotal;
            return { centreId: c.id, centreName: c.name, streamsTotal: cStreamsTotal, streamsComplete: cStreamsComplete, cellsDone: cCellsDone, cellsTotal: cCellsTotal, streams: trackerStreams };
        });

        totalCompleteStreams += wStreamsComplete;
        return { 
            wardId: w.id, 
            wardName: w.name, 
            constituency_id: w.constituency_id, // <-- CRITICAL for grouping!
            streamsTotal: wStreamsTotal, 
            streamsComplete: wStreamsComplete, 
            cellsDone: wCellsDone, 
            cellsTotal: wCellsTotal, 
            centres: trackerCentres 
        };
    });

    TRACKER_DATA = {
        isMCA: (!USER.isSpectator && USER.position === 'MCA'), scopedWardName: USER.ward || '',
        positions: POSITIONS, 
        consts: constsData || [],
        wards: trackerWards,
        summary: { totalStreams: streamsData.length, completeStreams: totalCompleteStreams, pendingStreams: streamsData.length - totalCompleteStreams, cellsDone: (resultsData || []).length, cellsTotal: streamsData.length * POSITIONS.length, staleCount: 0, lastSubmitAt: null }
    };
    renderTracker();
  } catch (err) {
    console.error(err); if (!silent) toast('Connection error.', 'error');
  }
}

    var myCounties = OVERVIEW && OVERVIEW.counties ? OVERVIEW.counties : [];
    el.innerHTML = myCounties.map(c => 
      buildCard(c, OVERVIEW.votesByCounty, 'County', `drillDown('constituency', '${c.id}', '${c.name}')`)
    ).join('');

  }

  if (DRILL_LEVEL === 'constituency') {
    var myConsts = OVERVIEW.consts ? OVERVIEW.consts.filter(c => SCOPE_MODE !== 'national' || c.county_id === DRILL_COUNTY_ID) : [];
    el.innerHTML = myConsts.map(c => 
      buildCard(c, OVERVIEW.votesByConst, 'Constituency', `drillDown('ward', '${c.id}', '${c.name}')`)
    ).join('');
    return;
  }

  if (DRILL_LEVEL === 'ward') {
    var myWards = OVERVIEW.wards ? OVERVIEW.wards.filter(w => w.constituency_id === DRILL_CONST_ID) : [];
    el.innerHTML = myWards.map(w => 
      buildCard(w, OVERVIEW.votesByWard, 'Ward', `drillDown('centre', '${w.id}', '${w.name}')`)
    ).join('');
    return;
  }

  if (DRILL_LEVEL === 'centre') {
    var myCentres = OVERVIEW.centres ? OVERVIEW.centres.filter(c => c.ward_id === DRILL_WARD) : [];
    el.innerHTML = myCentres.map(c => 
      buildCard(c, OVERVIEW.votesByCentre, 'Polling Centre', `drillDown('stream', '${c.id}', '${c.name}')`)
    ).join('');

  }

  if (DRILL_LEVEL === 'stream') {
    var myStreams = OVERVIEW.streams ? OVERVIEW.streams.filter(s => s.centre_id === DRILL_CENTRE) : [];
    el.innerHTML = myStreams.map(s => {
      var streamLabel = 'STR ' + String(s.stream_number).padStart(2, '0');
      return buildCard({ code: s.code, name: streamLabel }, OVERVIEW.votesByStream, s.code, `openStreamDetail('${s.code}')`);
    }).join('');
    return;
  }
}
function drillDown(level, id, name) {

  if (level === 'centre') { DRILL_WARD = id; DRILL_WARD_NAME = name; DRILL_LEVEL = 'centre'; }
  if (level === 'stream') { DRILL_CENTRE = id; DRILL_CENTRE_NAME = name; DRILL_LEVEL = 'stream'; }
  
  renderDrillGrid(); renderBoard(); renderBreadcrumb();
  window.scrollTo({ top: document.getElementById('drillGrid').offsetTop - 100, behavior: 'smooth' });
}

function statusChip(done, total) {
  if (total === 0) return { cls: 'pending', label: '—' };
  var pct = done / total;
  if (pct === 1) return { cls: 'done', label: '<i class="fas fa-circle-check"></i> ' + done + '/' + total };
  if (pct > 0) return { cls: 'partial', label: '<i class="fas fa-circle-half-stroke"></i> ' + done + '/' + total };
  return { cls: 'pending', label: '<i class="fas fa-circle"></i> 0/' + total };
}
function emptyGrid(title, sub) { return '<div class="empty" style="grid-column:1/-1;"><div class="empty-icon"><i class="fas fa-inbox"></i></div><div class="empty-title">' + title + '</div><div class="empty-sub">' + sub + '</div></div>'; }

function getScopedLeaderboard() {
  if (!OVERVIEW) return null;
  if (DRILL_WARD && !DRILL_CENTRE) {
    var ward = (OVERVIEW.wards || []).filter(function (w) { return w.wardId === DRILL_WARD; })[0];
    if (!ward) return null;
    return { candidates: ward.candidates || [], total: ward.totalVotes || 0, context: ward.wardName + ' Ward', streamsDone: ward.streamsDone, streamsTotal: ward.streamsTotal };
  }
  if (DRILL_CENTRE && DRILL_DATA && DRILL_DATA.level === 'stream') {
    var byCode = {};
    (DRILL_DATA.streams || []).forEach(function (s) { 
      (s.candidates || []).forEach(function (c) { 
        if (!byCode[c.code]) { 
          // THIS IS THE FIX: It was 'photo', now it is 'photo_url'
          byCode[c.code] = { code: c.code, name: c.name, party: c.party, photo_url: c.photo_url || '', votes: 0 }; 
        } 
        byCode[c.code].votes += c.votes; 
      }); 
    });
    var arr = Object.keys(byCode).map(function (k) { return byCode[k]; }); 
    var total = arr.reduce(function (s, c) { return s + c.votes; }, 0);
    return { candidates: arr, total: total, context: DRILL_CENTRE_NAME + ' Centre', streamsDone: (DRILL_DATA.streams || []).filter(function (s) { return s.submitted; }).length, streamsTotal: (DRILL_DATA.streams || []).length };
  }
  return null;
}

function renderBoard() {
  if (!OVERVIEW) return;
  var el = document.getElementById('board');
  var scopedCandidates = [];

  // Figure out which candidates to show based on the Drill Level
  if (DRILL_LEVEL === 'constituency') {
    scopedCandidates = OVERVIEW.leaderboard;
  } else if (DRILL_LEVEL === 'ward') {
    var votes = OVERVIEW.votesByConst[DRILL_CONST_ID] || {};
    scopedCandidates = OVERVIEW.leaderboard.map(c => ({ ...c, votes: votes[c.code] || 0 })).sort((a,b)=>b.votes-a.votes);
  } else if (DRILL_LEVEL === 'centre') {
    var votes = OVERVIEW.votesByWard[DRILL_WARD] || {};
    scopedCandidates = OVERVIEW.leaderboard.map(c => ({ ...c, votes: votes[c.code] || 0 })).sort((a,b)=>b.votes-a.votes);
  } else if (DRILL_LEVEL === 'stream') {
    var votes = OVERVIEW.votesByCentre[DRILL_CENTRE] || {};
    scopedCandidates = OVERVIEW.leaderboard.map(c => ({ ...c, votes: votes[c.code] || 0 })).sort((a,b)=>b.votes-a.votes);
  }

  var total = scopedCandidates.reduce((s,c)=>s+c.votes, 0);
  if (!scopedCandidates.length) { el.innerHTML = '<div class="empty">No candidates.</div>'; return; }

  el.innerHTML = scopedCandidates.map((c, idx) => {
    var pct = total > 0 ? (c.votes/total*100) : 0;
    var isYou = isOwnCandidate(c.name);
    return `<div class="board-row ${idx===0?'leader':''} ${isYou?'you':''}" onclick="openCandidateDetail('${c.code}')">
      <div class="avatar-wrap ${c.photo_url ? '' : 'no-photo'}">
        ${c.photo_url ? `<img src="${c.photo_url}">` : c.name.charAt(0)}
        <span class="avatar-rank">${idx+1}</span>
      </div>
      <div class="board-info">
        <div class="board-name">${esc(c.name)} ${isYou ? '<span class="board-you-pill">You</span>' : ''}</div>
        <div class="board-party">${esc(c.party)}</div>
      </div>
      <div style="text-align:right;">
        <div class="board-votes">${c.votes.toLocaleString()}</div>
        <div class="board-pct">${pct.toFixed(1)}%</div>
      </div>
    </div>`;
  }).join('');
}

function resetDrill() {
  DRILL_COUNTY_ID = ''; DRILL_COUNTY_NAME = '';
  DRILL_CONST_ID = ''; DRILL_CONST_NAME = '';
  DRILL_WARD = ''; DRILL_WARD_NAME = '';
  DRILL_CENTRE = ''; DRILL_CENTRE_NAME = '';

  if (SCOPE_MODE === 'national') DRILL_LEVEL = 'county';
  else if (SCOPE_MODE === 'county') DRILL_LEVEL = 'constituency';
  else if (SCOPE_MODE === 'constituency') DRILL_LEVEL = 'ward';
  else if (SCOPE_MODE === 'ward') DRILL_LEVEL = 'centre';

  renderDrillGrid(); renderBoard(); renderBreadcrumb();
}
function drillToWard(wardId, wardName) { DRILL_WARD = wardId; DRILL_WARD_NAME = wardName; DRILL_CENTRE = ''; DRILL_CENTRE_NAME = ''; DRILL_DATA = null; renderHero(); renderBoard(); renderDrillGrid(); document.getElementById('drillGrid').innerHTML = '<div class="load" style="grid-column:1/-1;"><i class="fas fa-spinner"></i>Loading centres…</div>'; loadDrill(); window.scrollTo({ top: document.querySelector('.section-head').offsetTop - 120, behavior: 'smooth' }); }
function drillToCentre(centreId, centreName) { DRILL_CENTRE = centreId; DRILL_CENTRE_NAME = centreName; DRILL_DATA = null; renderHero(); renderBoard(); renderDrillGrid(); document.getElementById('drillGrid').innerHTML = '<div class="load" style="grid-column:1/-1;"><i class="fas fa-spinner"></i>Loading streams…</div>'; loadDrill(); window.scrollTo({ top: document.querySelector('.section-head').offsetTop - 120, behavior: 'smooth' }); }

function switchView(view) {
  if (view === CURRENT_VIEW) return; CURRENT_VIEW = view;
  document.querySelectorAll('.viewtab').forEach(function (t) { t.classList.toggle('active', t.dataset.view === view); });
  document.body.classList.toggle('tracker-mode', view === 'tracker');
  var resultsView = document.getElementById('resultsView'); var trackerView = document.getElementById('trackerView');
  if (resultsView) resultsView.style.display = view === 'results' ? '' : 'none'; if (trackerView) trackerView.style.display = view === 'tracker' ? '' : 'none';
  if (view === 'tracker') { if (!TRACKER_DATA) loadTracker(); else renderTracker(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTracker() {
  if (!TRACKER_DATA) return;
  
  // 1. Alert banner
  var el = document.getElementById('trackerAlert'); 
  var s = TRACKER_DATA.summary;
  el.innerHTML = s.staleCount <= 5 ? '' : '<div class="tracker-alert"><i class="fas fa-triangle-exclamation"></i><div><strong>' + s.staleCount + ' streams</strong> haven\'t reported in over 2 hours</div></div>';

  // 2. Summary tiles
  var summaryEl = document.getElementById('trackerSummary');
  var pct = s.totalStreams > 0 ? Math.round(s.completeStreams / s.totalStreams * 100) : 0;
  var lastText = s.lastSubmitAt ? timeAgo(new Date(s.lastSubmitAt).getTime()) : 'Never';
  summaryEl.innerHTML = '<div class="tracker-stat green"><div class="num">' + s.completeStreams + '/' + s.totalStreams + '</div><div class="lbl">Complete</div></div><div class="tracker-stat blue"><div class="num">' + s.pendingStreams + '</div><div class="lbl">Pending</div></div><div class="tracker-stat blue"><div class="num">' + pct + '%</div><div class="lbl">Progress</div></div><div class="tracker-stat"><div class="num small">' + esc(lastText) + '</div><div class="lbl">Last Submit</div></div>';

  // 3. Tell the grid to render
  renderTrackerBreadcrumb();
  renderTrackerGrid();
}

function renderTrackerGrid() {
  if (!TRACKER_DATA) return;

  var gridEl = document.getElementById('trackerGrid'); 
  var title = document.getElementById('trackerTitle'); 
  var sub = document.getElementById('trackerSub'); 
  var count = document.getElementById('trackerCount');

  // --- LEVEL 1: CONSTITUENCIES ---
  if (TRACKER_LEVEL === 'constituency') {
    title.textContent = 'Constituency Status';
    sub.textContent = 'Submission progress by constituency';
    
    // Group wards by constituency
    var constGroups = {};
    (TRACKER_DATA.consts || []).forEach(c => { constGroups[c.id] = { id: c.id, name: c.name, streamsTotal: 0, streamsComplete: 0, cellsDone: 0, cellsTotal: 0 }; });
    
    (TRACKER_DATA.wards || []).forEach(w => {
      if (constGroups[w.constituency_id]) {
        constGroups[w.constituency_id].streamsTotal += w.streamsTotal;
        constGroups[w.constituency_id].streamsComplete += w.streamsComplete;
        constGroups[w.constituency_id].cellsDone += w.cellsDone;
        constGroups[w.constituency_id].cellsTotal += w.cellsTotal;
      }
    });

    var groupsArr = Object.values(constGroups);
    count.textContent = groupsArr.length + ' constituencies';
    if (!groupsArr.length) { gridEl.innerHTML = '<div class="empty">No constituencies.</div>'; return; }

    gridEl.innerHTML = groupsArr.map(c => {
      var cellPct = c.cellsTotal > 0 ? (c.cellsDone / c.cellsTotal * 100) : 0; 
      var isComplete = c.streamsTotal > 0 && c.streamsComplete === c.streamsTotal; 
      var isPending = c.streamsComplete === 0;
      var cls = 'card' + (isComplete ? ' leading' : (isPending ? ' empty' : ' trailing')); 
      var chip = trackerChip(c.streamsComplete, c.streamsTotal);
      
      return `<div class="${cls}" onclick="trackerDrill('ward', '${c.id}', '${esc(c.name)}')">
        <div class="card-head"><div><div class="card-name">${esc(c.name)}</div><div class="card-sub">Constituency</div></div><span class="card-status ${chip.cls}">${chip.label}</span></div>
        <div><div class="card-numbers"><span class="card-votes">${c.streamsComplete} / ${c.streamsTotal}</span><span class="card-pct">${cellPct.toFixed(1)}%</span></div><div class="card-votes-lbl">Streams complete</div></div>
        <div class="card-bar"><div class="card-bar-fill" style="width:${cellPct}%"></div></div>
      </div>`;
    }).join('');
    return;
  }

  // --- LEVEL 2: WARDS ---
  if (TRACKER_LEVEL === 'ward') {
    var myWards = TRACKER_DATA.wards.filter(w => w.constituency_id === TRACKER_CONST_ID);
    title.textContent = TRACKER_CONST_NAME + ' Wards'; 
    sub.textContent = 'Submission progress by ward';
    count.textContent = myWards.length + ' wards';

    gridEl.innerHTML = myWards.map(renderTrackerWardCard).join('');
    return;
  }

  // --- LEVEL 3: CENTRES ---
  if (TRACKER_LEVEL === 'centre') {
    var ward = TRACKER_DATA.wards.find(w => w.wardId === TRACKER_WARD);
    if (!ward) { gridEl.innerHTML = ''; return; }

    title.textContent = ward.wardName + ' Centres'; 
    sub.textContent = ward.streamsComplete + ' of ' + ward.streamsTotal + ' streams complete'; 
    count.textContent = ward.centres.length + ' centres';
    
    gridEl.innerHTML = ward.centres.map(renderTrackerCentreCard).join(''); 
    return;
  }

  // --- LEVEL 4: STREAMS ---
  if (TRACKER_LEVEL === 'stream') {
    var ward = TRACKER_DATA.wards.find(w => w.wardId === TRACKER_WARD);
    var centre = ward ? ward.centres.find(c => c.centreId === TRACKER_CENTRE) : null;
    if (!centre) { gridEl.innerHTML = ''; return; }
    
    title.textContent = centre.centreName + ' Streams'; 
    sub.textContent = centre.streamsComplete + ' of ' + centre.streamsTotal + ' streams complete · all positions'; 
    count.textContent = centre.streams.length + ' streams';
    
    gridEl.innerHTML = centre.streams.map(renderTrackerStreamCard).join('');
    return;
  }
 }

function findTrackerStreamContext(streamCode) {
  if (!TRACKER_DATA) return null; var wards = TRACKER_DATA.wards || [];
  for (var i = 0; i < wards.length; i++) { var centres = wards[i].centres || []; for (var j = 0; j < centres.length; j++) { var streams = centres[j].streams || []; for (var k = 0; k < streams.length; k++) { if (streams[k].code === streamCode) return { ward: wards[i], centre: centres[j], stream: streams[k] }; } } }
  return null;
}

async function openTrackerPip(streamCode, position) {
  var sheetBg = document.getElementById('sheetBg'); 
  var sheet = document.getElementById('sheetContent');
  if (!sheetBg || !sheet) { toast('Could not open sheet — please reload.', 'error'); return; }
  
  var ctx = findTrackerStreamContext(streamCode);
  var label = ctx ? ctx.stream.label : streamCode; 
  var centreName = ctx ? ctx.centre.centreName : ''; 
  var wardName = ctx ? ctx.ward.wardName : '';

  sheetBg.classList.add('active');
  sheet.innerHTML = '<div class="sheet-head"><div><div class="sheet-title">' + esc(position) + ' · ' + esc(label) + '</div><div class="sheet-sub">' + esc(centreName) + ' · ' + esc(wardName) + ' Ward</div></div><button class="sheet-close" onclick="closeSheet()"><i class="fas fa-xmark"></i></button></div><div class="load"><i class="fas fa-spinner"></i>Loading results…</div>';

  try {
    // 1. Fetch Results
    const { data: results } = await db.from('results')
      .select('votes, submitted_by, created_at, candidates(name, party, photo_url)')
      .eq('stream_code', streamCode).eq('position', position);

    if (!results || results.length === 0) {
      sheet.innerHTML = '<div class="sheet-head"><div><div class="sheet-title">' + esc(position) + ' · ' + esc(label) + '</div><div class="sheet-sub">' + esc(centreName) + ' · ' + esc(wardName) + ' Ward</div></div><button class="sheet-close" onclick="closeSheet()"><i class="fas fa-xmark"></i></button></div><div class="empty"><div class="empty-icon"><i class="fas fa-hourglass-half"></i></div><div class="empty-title">Not submitted yet</div></div>';
      return;
    }

    const mappedResults = results.map(r => ({
      candidateName: r.candidates.name, 
      party: r.candidates.party, 
      photo_url: normalizeImageUrl(r.candidates.photo_url), 
      votes: r.votes
    })).sort((a, b) => b.votes - a.votes);

    // 2. Fetch Signed URL for the Form Photo (if it exists)
    var formPhotoUrl = '';
    var fileName = TRACKER_FORMS[streamCode + '_' + position];
    if (fileName) {
      const { data: signedData } = await db.storage.from('form-photos').createSignedUrl(fileName, 600); // Valid for 10 mins
      if (signedData) formPhotoUrl = signedData.signedUrl;
    }

    const res = {
        submitted: true, 
        submittedBy: results[0].submitted_by, 
        submittedByName: results[0].submitted_by, 
        submittedAt: new Date(results[0].created_at).toLocaleString(), 
        results: mappedResults
    };
    
    renderTrackerPipResult(res, position, label, centreName, wardName, formPhotoUrl);
  } catch (err) {
    sheet.innerHTML = '<div class="sheet-head"><div><div class="sheet-title">' + esc(position) + '</div></div><button class="sheet-close" onclick="closeSheet()"><i class="fas fa-xmark"></i></button></div><div class="empty"><div class="empty-title">Connection error</div></div>';
  }
}

function trackerChip(done, total) {
  if (total === 0) return { cls: 'pending', label: '—' };
  if (done === total) return { cls: 'done', label: '<i class="fas fa-circle-check"></i> ' + done + '/' + total };
  if (done > 0) return { cls: 'partial', label: '<i class="fas fa-circle-half-stroke"></i> ' + done + '/' + total };
  return { cls: 'pending', label: '<i class="fas fa-circle"></i> 0/' + total };
}

function trackerResetDrill() {
  TRACKER_CONST_ID = ''; TRACKER_CONST_NAME = '';
  TRACKER_WARD = ''; TRACKER_WARD_NAME = '';
  TRACKER_CENTRE = ''; TRACKER_CENTRE_NAME = '';

function openCandidateDetail(code) {
  if (!OVERVIEW) return;
  var sheetBg = document.getElementById('sheetBg'); var sheet = document.getElementById('sheetContent'); if (!sheetBg || !sheet) return;
  var isMCA = OVERVIEW.viewingPosition === 'MCA'; var pool = null; var totalVotes = 0; var subtitleContext = OVERVIEW.viewingPosition;

  if (isMCA && DRILL_WARD && DRILL_CENTRE && DRILL_DATA && DRILL_DATA.level === 'stream') {
    var centreCandidates = {};

      (s.candidates || []).forEach(function (c) { 
        if (!centreCandidates[c.code]) {

          centreCandidates[c.code] = { code: c.code, name: c.name, party: c.party, photo_url: c.photo_url || '', votes: 0 }; 
        } 
        centreCandidates[c.code].votes += c.votes; 
      }); 
    });
    pool = Object.keys(centreCandidates).map(function (k) { return centreCandidates[k]; }); pool.sort(function (a, b) { return b.votes - a.votes; }); totalVotes = pool.reduce(function (s, c) { return s + c.votes; }, 0); subtitleContext = DRILL_CENTRE_NAME + ' · MCA';
  } else if (isMCA && DRILL_WARD) {
    var ward = (OVERVIEW.wards || []).filter(function (w) { return w.wardId === DRILL_WARD; })[0];
    if (ward) { pool = ward.candidates || []; totalVotes = ward.totalVotes || 0; subtitleContext = ward.wardName + ' · MCA'; }

  var me = pool.filter(function (c) { return c.code === code; })[0]; if (!me) return;
  var rank = pool.indexOf(me) + 1; var leader = pool[0]; var isYou = isOwnCandidate(me.name) && !USER.isSpectator; var myPct = totalVotes > 0 ? (me.votes / totalVotes * 100).toFixed(1) : '0.0';
  
  var ownRow = null; if (!USER.isSpectator && USER.name) { ownRow = pool.filter(function (c) { return String(c.name).toLowerCase().trim() === String(USER.name).toLowerCase().trim(); })[0]; }
  var compareWith = (ownRow && ownRow.code !== me.code) ? ownRow : null;

  if (compareWith) {
    var aWins = me.votes > compareWith.votes; var comparePct = totalVotes > 0 ? (compareWith.votes / totalVotes * 100).toFixed(1) : '0.0'; var compareRank = pool.indexOf(compareWith) + 1;
    sheet.innerHTML = '<div class="sheet-head"><div><div class="sheet-title">Head to Head</div><div class="sheet-sub">' + esc(subtitleContext) + ' · ' + totalVotes.toLocaleString() + ' total votes</div></div><button class="sheet-close" onclick="closeSheet()"><i class="fas fa-xmark"></i></button></div><div class="cmp-grid"><div class="cmp-card ' + (aWins ? 'winner' : '') + '"><div class="who">' + (aWins ? '<i class="fas fa-crown"></i> Leading' : 'Challenger') + '</div>' + (me.photo_url ? '<div class="cmp-avatar"><img src="' + escAttr(me.photo_url) + '" alt="" onerror="this.style.display=\'none\'"></div>' : '') + '<div class="cmp-name">' + esc(me.name) + '</div><div class="cmp-party">' + esc(me.party) + ' · #' + rank + '</div><div class="cmp-votes">' + me.votes.toLocaleString() + '</div><div class="cmp-pct">' + myPct + '% of votes</div></div><div class="cmp-card ' + (!aWins ? 'winner' : '') + '"><div class="who">' + (!aWins ? '<i class="fas fa-crown"></i> Leading' : 'You') + '</div>' + (compareWith.photo_url ? '<div class="cmp-avatar"><img src="' + escAttr(compareWith.photo_url) + '" alt="" onerror="this.style.display=\'none\'"></div>' : '') + '<div class="cmp-name">' + esc(compareWith.name) + '</div><div class="cmp-party">' + esc(compareWith.party) + ' · #' + compareRank + '</div><div class="cmp-votes">' + compareWith.votes.toLocaleString() + '</div><div class="cmp-pct">' + comparePct + '% of votes</div></div></div><div style="text-align:center;padding:14px;background:var(--canvas);border-radius:12px;font-size:13px;color:var(--slate);"><strong style="color:var(--ink);font-size:15px;">' + Math.abs(me.votes - compareWith.votes).toLocaleString() + '</strong> vote margin</div>';
    sheetBg.classList.add('active'); return;
  }

  var behindText;
  if (leader && leader.code !== me.code) { behindText = '<div style="padding:14px;background:var(--canvas);border-radius:12px;font-size:13px;color:var(--slate);text-align:center;">Behind <strong style="color:var(--ink);">' + esc(leader.name) + '</strong> by <strong style="color:var(--ink);">' + (leader.votes - me.votes).toLocaleString() + '</strong> votes</div>'; }
  else { behindText = '<div style="padding:14px;background:var(--green-soft);border-radius:12px;font-size:13px;color:var(--green-dark);text-align:center;font-weight:600;"><i class="fas fa-crown"></i> Currently leading ' + esc(subtitleContext) + '</div>'; }

  sheet.innerHTML = '<div class="sheet-head"><div><div class="sheet-title">' + esc(me.name) + '</div><div class="sheet-sub">' + esc(me.party) + ' · ' + esc(subtitleContext) + '</div></div><button class="sheet-close" onclick="closeSheet()"><i class="fas fa-xmark"></i></button></div><div class="cmp-grid"><div class="cmp-card ' + (rank === 1 ? 'winner' : '') + '"><div class="who">Rank</div><div class="cmp-votes">#' + rank + '</div></div><div class="cmp-card ' + (rank === 1 ? 'winner' : '') + '"><div class="who">' + (isYou ? 'Your votes' : 'Votes') + '</div><div class="cmp-votes">' + me.votes.toLocaleString() + '</div><div class="cmp-pct">' + myPct + '% share</div></div></div>' + behindText;
  sheetBg.classList.add('active');
}

// UTILS
function isOwnCandidate(name) { if (!USER || USER.isSpectator || !USER.name) return false; return String(name).toLowerCase().trim() === String(USER.name).toLowerCase().trim(); }
function setPulse(mode) { var el = document.getElementById('topPulse'); if (!el) return; el.className = 'pulse ' + (mode === 'live' ? '' : mode === 'loading' ? 'loading' : 'stale'); }
function timeAgo(ts) { if (!ts) return 'updating…'; var s = Math.floor((Date.now() - ts) / 1000); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; var m = Math.floor(s / 60); if (m < 60) return m + 'm ago'; var h = Math.floor(m / 60); return h + 'h ago'; }
function saveSnapshot(position, leaderboard) { try { var snap = { at: Date.now(), byCode: {} }; leaderboard.forEach(function (c) { snap.byCode[c.code] = c.votes; }); sessionStorage.setItem('snap_' + position, JSON.stringify(snap)); } catch (e) {} }
function getSnapshot(position) { try { var raw = sessionStorage.getItem('snap_' + position); if (!raw) return null; var snap = JSON.parse(raw); return snap.byCode || null; } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function tintBg(hex, alpha) { if (!hex) return ''; hex = String(hex).trim(); if (hex.charAt(0) === '#') hex = hex.slice(1); if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]; if (hex.length !== 6) return ''; var r = parseInt(hex.slice(0, 2), 16); var g = parseInt(hex.slice(2, 4), 16); var b = parseInt(hex.slice(4, 6), 16); if (isNaN(r) || isNaN(g) || isNaN(b)) return ''; return 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha || 0.07) + ')'; }
function escAttr(s) { return esc(s); }
function toast(msg, type) { type = type || 'info'; var icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' }; var el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span></span>'; el.querySelector('span').textContent = msg; document.getElementById('toasts').appendChild(el); setTimeout(function () { if (el.parentElement) el.remove(); }, 4000); }

function doLogout() {
  thConfirm({
    title: 'Sign out?',
    message: 'You will need your login code to access the dashboard again.',
    confirmText: 'Sign Out',
    cancelText: 'Stay',
    tone: 'danger',
    icon: 'fa-right-from-bracket'
  }).then(function (ok) { 
    if (ok) {
      db.auth.signOut().then(() => window.location.href = 'index.html'); 
    }
  });
}

setInterval(function () { var el = document.querySelector('.hero-live'); if (el && lastRefreshAt) { el.innerHTML = '<span class="dot"></span>Live · ' + esc(timeAgo(lastRefreshAt)); } }, 30000);
function normalizeImageUrl(raw) {
  if (!raw) return '';
  raw = String(raw).trim();
  if (!raw) return '';

  // Already a CDN URL
  if (raw.includes('cdn.jsdelivr.net/gh/') || raw.includes('lh3.googleusercontent.com/d/')) return raw;

  // GitHub blob URL → jsDelivr CDN
  var m = raw.match(/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/);
  if (m) return 'https://cdn.jsdelivr.net/gh/' + m[1] + '/' + m[2] + '@' + m[3] + '/' + m[4];

  // Raw GitHub URL → jsDelivr CDN
  m = raw.match(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)$/);
  if (m) return 'https://cdn.jsdelivr.net/gh/' + m[1] + '/' + m[2] + '@' + m[3] + '/' + m[4];

  // Google Drive Links
  m = raw.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
  m = raw.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
  m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];

  // Any other direct http/https URL
  if (raw.startsWith('http://') || raw.startsWith('https://')) return raw;

  // Bare Drive ID
  if (/^[a-zA-Z0-9_-]{20,}$/.test(raw)) return 'https://lh3.googleusercontent.com/d/' + raw;

  return '';
}
function thConfirm(opts) {
  return new Promise(function (resolve) {
    opts = opts || {};
    var tone = opts.tone || 'warn';
    var single = !!opts.alertOnly;
    var iconMap = { warn: 'fa-exclamation-triangle', danger: 'fa-sign-out-alt', info: 'fa-circle-info' };
    var icon = opts.icon || iconMap[tone] || 'fa-question-circle';
    var confirmCls = tone === 'danger' ? 'th-btn-danger' : 'th-btn-primary';

    var actions = single
      ? '<button class="th-btn th-btn-primary" data-act="ok">' + esc(opts.confirmText || 'OK') + '</button>'
      : '<button class="th-btn th-btn-ghost" data-act="cancel">' + esc(opts.cancelText || 'Cancel') + '</button>' +
        '<button class="th-btn ' + confirmCls + '" data-act="ok">' + esc(opts.confirmText || 'Confirm') + '</button>';

    var wrap = document.createElement('div');
    wrap.className = 'th-modal-bg';
    wrap.innerHTML =
      '<div class="th-modal">' +
        '<div class="th-modal-icon ' + tone + '"><i class="fas ' + icon + '"></i></div>' +
        '<div class="th-modal-title">' + esc(opts.title || 'Confirm') + '</div>' +
        (opts.message ? '<div class="th-modal-msg">' + opts.message + '</div>' : '') +
        '<div class="th-modal-actions' + (single ? ' single' : '') + '">' + actions + '</div>' +
      '</div>';

    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add('active'); });

    var resolved = false;
    function close(val) {
      if (resolved) return;
      resolved = true;
      wrap.classList.remove('active');
      setTimeout(function () { if (wrap.parentElement) wrap.remove(); }, 220);
      document.removeEventListener('keydown', onKey);
      resolve(val);
    }
    function onKey(e) {
      if (e.key === 'Escape') close(false);
      else if (e.key === 'Enter') close(true);
    }
    wrap.addEventListener('click', function (e) {
      if (e.target === wrap) return close(false);
      var act = e.target.closest('[data-act]');
      if (!act) return;
      close(act.dataset.act === 'ok');
    });
    document.addEventListener('keydown', onKey);
    setTimeout(function () { var ok = wrap.querySelector('[data-act="ok"]'); if (ok) ok.focus(); }, 60);
  });
}
// ================================================================
//  CUSTOM PREMIUM DROPDOWN ENGINE
// ================================================================
var activeSelectElement = null;
var isOpeningSelect = false; 

function openCustomSelect(select) {
  if (isOpeningSelect) return;
  isOpeningSelect = true;
  activeSelectElement = select;
  
  var title = select.getAttribute('data-title') || 'Select Option';
  document.getElementById('customSelectTitle').textContent = title;

  var list = document.getElementById('customSelectList');
  list.innerHTML = '';

  Array.from(select.options).forEach(function(opt) {
    var isSelected = opt.value === select.value;
    var div = document.createElement('div');
    div.className = 'custom-select-option' + (isSelected ? ' selected' : '');
    div.innerHTML = `<span>${opt.text}</span> <i class="fas fa-check"></i>`;
    
    div.onclick = function(e) {
      e.stopPropagation();
      select.value = opt.value;
      // Trigger the original onchange event
      select.dispatchEvent(new Event('change'));
      closeCustomSelect();
    };
    list.appendChild(div);
  });

  document.getElementById('customSelectModal').classList.add('active');
  
  // Reset guard after animation
  setTimeout(() => { isOpeningSelect = false; }, 300);
}

// 1. INTERCEPT MOBILE TOUCH (Stops the native Android/iOS menu)
document.addEventListener('touchstart', function(e) {
  var select = e.target.closest('select');
  if (!select) return;
  if (window.innerWidth > 768) return; // Only on mobile
  
  e.preventDefault(); // THIS STOPS THE NATIVE MENU
  openCustomSelect(select);
}, { passive: false, capture: true });

// 2. INTERCEPT DESKTOP CLICKS / MOBILE EMULATORS
document.addEventListener('mousedown', function(e) {
  var select = e.target.closest('select');
  if (!select) return;
  if (window.innerWidth > 768) return;
  
  e.preventDefault(); 
  openCustomSelect(select);
}, { capture: true });

function closeCustomSelect() {
  document.getElementById('customSelectModal').classList.remove('active');
  activeSelectElement = null;
  isOpeningSelect = false;
}
  // START
init();
</script>
